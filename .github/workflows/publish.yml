# Publica @_bashell/slash no npm quando a main recebe uma versão ainda não publicada.
# Fluxo: release/x.y.z (git flow) -> merge na main -> este workflow publica.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: proveniência agora e Trusted Publishing no futuro

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Versão ainda não publicada?
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION já está no npm; nada a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publicando $NAME@$VERSION."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências
        if: steps.check.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Testes
        if: steps.check.outputs.publish == 'true'
        run: bun test

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: bun run build

      - name: Publicar
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
